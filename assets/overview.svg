<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b93b5"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="1" y="1" width="998" height="318" rx="16" fill="#0d0f1e" stroke="#2b2f45"/>

  <!-- "this repo" container -->
  <rect x="30" y="58" width="560" height="205" rx="14" fill="#12152a" stroke="#3a3f5a" stroke-dasharray="6 5"/>
  <text x="48" y="80" fill="#8b93b5" font-size="12.5" font-weight="600">defcon-camera · this repo</text>

  <!-- Badge firmware -->
  <rect x="52" y="98" width="238" height="150" rx="12" fill="#1b1030" stroke="#6e40c9" stroke-width="2"/>
  <text x="171" y="148" text-anchor="middle" fill="#e9ebf6" font-size="15" font-weight="700">Badge firmware</text>
  <text x="171" y="171" text-anchor="middle" fill="#c3c8dd" font-size="12">bao-video dumps a frame</text>
  <text x="171" y="191" text-anchor="middle" fill="#9aa0b8" font-size="10.5" font-family="ui-monospace, Menlo, monospace">PHOTOSTART · PHOTO · PHOTOEND</text>
  <text x="171" y="215" text-anchor="middle" fill="#c3c8dd" font-size="12">+ a custom LED show</text>

  <!-- Host bridge -->
  <rect x="360" y="118" width="200" height="110" rx="12" fill="#101a2e" stroke="#5aa2ff" stroke-width="2"/>
  <text x="460" y="152" text-anchor="middle" fill="#e9ebf6" font-size="15" font-weight="700">Host bridge</text>
  <text x="460" y="176" text-anchor="middle" fill="#9fd0ff" font-size="12" font-family="ui-monospace, Menlo, monospace">capture.py</text>
  <text x="460" y="198" text-anchor="middle" fill="#c3c8dd" font-size="12">enhances + uploads PNG</text>

  <!-- Web gallery -->
  <rect x="740" y="118" width="230" height="110" rx="12" fill="#2a0f1a" stroke="#ff2d55" stroke-width="2"/>
  <text x="855" y="152" text-anchor="middle" fill="#e9ebf6" font-size="15" font-weight="700">Web gallery</text>
  <text x="855" y="176" text-anchor="middle" fill="#c3c8dd" font-size="12">Next.js polaroid wall</text>
  <text x="855" y="198" text-anchor="middle" fill="#ff8fb0" font-size="11.5">defcon-polaroid ↗</text>

  <!-- arrow: badge -> bridge -->
  <line x1="296" y1="173" x2="354" y2="173" stroke="#8b93b5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="325" y="164" text-anchor="middle" fill="#8b93b5" font-size="10.5">USB · serial</text>

  <!-- arrow: bridge -> gallery -->
  <line x1="566" y1="173" x2="734" y2="173" stroke="#8b93b5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="164" text-anchor="middle" fill="#8b93b5" font-size="10.5">HTTPS</text>
</svg>
