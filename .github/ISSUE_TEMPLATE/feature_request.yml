name: "✨ Feature / idea"
description: Suggest a new badge hack, LED effect, capture improvement, or docs addition.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas welcome! For **gallery** features, use
        [defcon-polaroid](https://github.com/ivoinestrachan/defcon-polaroid/issues) instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Camera capture (quality, speed, format)
        - LEDs / lights
        - Flashing / build workflow
        - Host bridge (capture.py)
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or idea?
      description: What would you like to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional — how you'd tackle it, files involved, etc.
